name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Cold CI builds have an explicit 660s runner budget, not an hours-long fallback.
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # A single stuck libtest case previously blocked the whole job. Build once,
      # isolate cases, and retain watchdog/timing evidence on both success and failure.
      - name: Test the test runner
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run bounded unit and CLI tests
        run: python3 scripts/test_runner.py --suite unit --timeout 15 --build-timeout 600 --run-timeout 660

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/test_reports/
          retention-days: 7
